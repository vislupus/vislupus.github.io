<!DOCTYPE html>
<html lang="en">
	<head>
		<title>{% if page.title %}{{ page.title }} – {% endif %}{{ site.title }}</title>

		{% include meta.html %}

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Space+Grotesk:wght@500;600;700&display=swap"
			rel="stylesheet"
		/>

		<link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/style.css" />
		<link rel="shortcut icon" type="image/png" href="{{ site.baseurl }}/assets/favicon.png" />
		<link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ site.baseurl }}/feed.xml" />

		{% if jekyll.environment == 'production' %}
			{% include analytics.html %}
		{% endif %}
	</head>

	<body>
		<a class="skip-link" href="#main">Skip to content</a>

		<header class="masthead">
			<div class="container">
				<div class="site-info">
					<h1 class="site-name">
						<a href="{{ site.baseurl }}/">{{ site.title }}</a>
					</h1>
					<p class="site-description">{{ site.description }}</p>
				</div>

				<nav>
					<a href="{{ site.baseurl }}/" {% if page.url == "/" %}class="active"{% endif %}>blog</a>
					<a href="{{ site.baseurl }}/tags" {% if page.url contains "/tags" %}class="active"{% endif %}>tags</a>
					<a href="{{ site.baseurl }}/about" {% if page.url contains "/about" %}class="active"{% endif %}>about</a>
				</nav>
			</div>
		</header>

		<div id="main" role="main" class="container">
			{{ content }}
		</div>

		<footer>
			{% include svg-icons.html %}

			<p>© {{ site.time | date: "%Y" }} {{ site.title }}. All rights reserved.</p>
		</footer>
	</body>
</html>
